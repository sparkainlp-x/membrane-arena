<html lang="en">

<title>Quorum Keeper</title>

<style>
:root {
  --bg: #0a1330;
  --bg2: #101c40;
  --panel: #12204a;
  --line: #2a3b6e;
  --text: #eef2ff;
  --muted: #b3bedb;
  --gold: #c9a84c;
  --gold-bright: #e0c36a;
  --cyan: #40d0e0;
  --blue: #7aa8ff;
  --aqua: #5ee6b8;
  --danger: #ff9a9a;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: radial-gradient(1400px 700px at 50% -10%, #16275a 0%, var(--bg) 60%) fixed;
  color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 12px 28px;
}
.skip { position: absolute; left: -999px; top: 0; background: var(--gold); color: #0a1330; padding: 8px 12px; z-index: 30; }
.skip:focus { left: 8px; top: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top, main, .foot { width: 100%; max-width: 1180px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 0 6px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.7rem; letter-spacing: 0.22em; color: var(--gold); font-weight: 700; }
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { border: 1px solid var(--cyan); color: var(--cyan); border-radius: 999px; padding: 2px 10px; font-size: 0.72rem; letter-spacing: 0.08em; }
main { outline: none; }
.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; min-width: 0; }
[hidden] { display: none !important; }
h2 { margin: 0 0 6px; font-size: 1.2rem; color: var(--gold-bright); }
h3 { margin: 16px 0 6px; font-size: 1rem; color: var(--gold-bright); }
h4 { margin: 0 0 4px; font-size: 1rem; color: var(--cyan); }
h2:focus, h2[tabindex="-1"]:focus { outline: none; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small-text { font-size: 0.85rem; }
.hint { color: var(--muted); font-size: 0.84rem; margin: 2px 0 10px; }
.beat { color: var(--cyan); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: #1a2a5c; color: var(--text); padding: 12px 16px;
  min-height: 44px; border-radius: 10px; font: inherit; cursor: pointer; touch-action: manipulation;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--gold); color: #0a1330; border-color: var(--gold); font-weight: 700; }
.btn.primary:hover { background: var(--gold-bright); }
.btn.small { padding: 6px 12px; min-height: 40px; font-size: 0.9rem; }
.btn[aria-pressed="true"] { border-color: var(--cyan); background: #12426a; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

.col-main { min-width: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); align-items: start; } }

.hud { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.92rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.hud-item { color: var(--muted); } .hud-item b { color: var(--text); }
.c-true { color: var(--cyan) !important; } .c-false { color: var(--danger) !important; } .c-gold { color: var(--gold-bright) !important; }
.canvas-wrap { position: relative; width: 100%; aspect-ratio: 16 / 10; background: #070e26; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (max-width: 640px) { .canvas-wrap { aspect-ratio: 1 / 1.05; } }
#arena { width: 100%; height: 100%; display: block; }
.canvas-msg { position: absolute; left: 12px; right: 12px; bottom: 8px; margin: 0; font-size: 0.85rem; color: var(--muted); }
.ribbon { list-style: none; display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0 0; padding: 0; }
.ribbon li { height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #0d1840; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--muted); }
.ribbon li.planted { border-style: solid; }
.ribbon li.noise { border-style: dashed; }
.ribbon li.t { background: #0f4b5a; border-color: var(--cyan); color: var(--text); }
.ribbon li.f { background: #4b2a34; border-color: var(--danger); color: var(--text); }
.ribbon li.h { background: #2a3350; border-color: var(--muted); color: var(--text); }
.ribbon li.cur { box-shadow: 0 0 0 2px var(--gold); }
.ticker { min-height: 1.5em; margin: 8px 0 0; color: var(--gold-bright); font-size: 0.92rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.inline { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); }
select {
  background: #0d1840; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; font: inherit; max-width: 100%;
}
.field { margin: 14px 0; }
.field > label { display: block; margin: 0 0 4px; font-weight: 600; }
.field select { width: 100%; }
.sliderrow { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
.sliderrow label { flex: 0 0 9.5em; margin: 0; }
.sliderrow .end { font-size: 0.8rem; color: var(--muted); }
input[type=range] { flex: 1; min-width: 110px; min-height: 44px; accent-color: var(--gold); }
output { min-width: 4ch; text-align: right; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.switch { display: flex; gap: 10px; align-items: center; min-height: 44px; margin: 6px 0 0; font-weight: 600; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }
.switches .hint { margin-left: 32px; }
details summary { cursor: pointer; padding: 8px 0; color: var(--cyan); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details[disabled] input { opacity: .5; }

.meters-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .meters-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.meter-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.m-name { width: 1.4em; font-weight: 700; color: var(--gold-bright); }
.meter { position: relative; flex: 1; height: 18px; background: #070e26; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.m-band { position: absolute; top: 0; bottom: 0; left: calc(0.33 / 3.2 * 100%); width: calc((3 - 0.33) / 3.2 * 100%); background: rgba(64, 208, 224, 0.12); border-left: 1px dashed var(--cyan); border-right: 1px dashed var(--cyan); }
.meter.off .m-band { display: none; }
.m-fill { position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; background: var(--cyan); border-radius: 6px; }
.m-fill.rate { background: var(--gold); }
.m-eff { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--text); left: 0; }
.m-tick { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--muted); }
.meter.clamped { border-color: var(--danger); }
.m-val { width: 9.5em; white-space: nowrap; text-align: right; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: 190px; background: #070e26; border: 1px solid var(--line); border-radius: 10px; display: block; }
.chart.tall { height: 340px; }
.chart.ens { height: 280px; }
.rail { width: 100%; height: 44px; display: block; background: #070e26; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; }
.key { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--cyan); vertical-align: middle; margin-right: 6px; }
.key-base { border-top: 3px dashed var(--gold); margin-left: 14px; }

.big { font-size: 1.6rem; font-weight: 700; color: var(--gold-bright); margin: 4px 0 8px; }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 9.5em 1fr 6.8em; gap: 10px; align-items: center; font-size: 0.9rem; }
.part .bar { height: 10px; background: #070e26; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.part .bar span { display: block; height: 100%; background: var(--cyan); }
.part .v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.tablewrap { overflow-x: auto; }
.scores { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.scores th, .scores td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.scores th:first-child, .scores td:first-child { text-align: left; white-space: normal; }
.scores th { color: var(--cyan); font-weight: 600; }
.lesson { margin-top: 14px; padding: 12px; border: 1px solid var(--gold); border-radius: 10px; background: #0e1a3d; }
.lesson h3 { margin-top: 0; }
pre {
  white-space: pre-wrap; word-break: break-word; background: #070e26; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font: 0.9rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
}
.stats { list-style: none; margin: 0; padding: 0; color: var(--muted); }
.stats li { padding: 2px 0; }
.modal { position: fixed; inset: 0; background: rgba(4, 8, 20, 0.82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-box { max-width: 560px; max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius); padding: 18px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
.foot p { margin: 4px 0; }
@media (max-width: 480px) { .sliderrow label { flex-basis: 100%; } .part { grid-template-columns: 7em 1fr 6.8em; } h1 { font-size: 1.35rem; } }
@media (prefers-reduced-motion: no-preference) {
  .m-fill { transition: width 0.25s ease; }
  .m-eff { transition: left 0.25s ease; }
  .card { animation: rise 0.25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- v0.2: tabs, Lab, ensemble, A/B, missions, replay, tour ---------- */
.tabs { padding-top: 8px; }
.tablist { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 0 -4px 12px; padding: 0 4px; scrollbar-width: thin; }
.tab {
  appearance: none; background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: 3px solid transparent;
  padding: 8px 14px; min-height: 44px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; border-radius: 8px 8px 0 0; touch-action: manipulation;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--gold-bright); border-bottom-color: var(--gold); background: rgba(201, 168, 76, 0.08); }
.tabpanel { outline: none; }
.tabpanel:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.inst-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 6px 16px; }
.inst { margin: 10px 0 14px; min-width: 0; }
.inst.wide { grid-column: 1 / -1; }
.inst h3 { margin-top: 4px; }
.inst select { min-height: 40px; padding: 4px 8px; }
.alt { margin: 6px 0 2px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--text); font-size: 0.86rem; }
.alt:empty { display: none; }
.formrow { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 8px 0; }
.formrow .switch { margin: 0; }
progress { width: min(100%, 320px); height: 14px; accent-color: var(--gold); vertical-align: middle; }
.exp { width: 100%; background: #070e26; color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: 0.8rem/1.3 ui-monospace, Menlo, Consolas, monospace; padding: 8px; }
.method { margin: 4px 0 8px; padding-left: 1.2em; color: var(--muted); font-size: 0.92rem; }
.method li { margin: 3px 0; }
.missions { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 10px; }
.mission { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #0e1a3d; }
.mission h3 { margin: 0 0 2px; }
.mission.done { border-color: var(--gold); }
.mission .status { font-weight: 600; color: var(--cyan); margin: 4px 0; font-size: 0.9rem; }
.mission.done .status { color: var(--gold-bright); }
.replay { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.replay h3 { margin-top: 0; }
.replay-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.replay-row input[type=range] { flex: 1; min-width: 140px; }
.tour { border-color: var(--gold); }
#help .modal-box h2:focus { outline: none; }
.row-end { display: flex; justify-content: flex-end; }

/* motion switched off in the page (in addition to the system setting) */
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

/* high-contrast mode: white on black, heavier outlines, no gradients */
html.hc { --bg: #000; --bg2: #000; --panel: #000; --line: #fff; --text: #fff; --muted: #f0f0f0; --gold: #ffd400; --gold-bright: #ffd400; --cyan: #00ffff; --blue: #9ec0ff; --aqua: #00ff96; --danger: #ff8a8a; }
html.hc body { background: #000; }
html.hc .card { background: #000; border-width: 2px; }
html.hc .btn { background: #000; border-width: 2px; }
html.hc .btn.primary { background: #ffd400; color: #000; border-color: #ffd400; }
html.hc .btn[aria-pressed="true"] { background: #003a3a; border-color: #00ffff; }
html.hc select, html.hc .exp, html.hc pre, html.hc .chart, html.hc .rail, html.hc .canvas-wrap, html.hc .meter { background: #000; border: 2px solid #fff; }
html.hc .tab[aria-selected="true"] { background: #1a1a00; border-bottom-width: 4px; }
html.hc .mission, html.hc .lesson { background: #000; border-width: 2px; }
html.hc .ribbon li { background: #000; border-width: 2px; color: #fff; }
html.hc .ribbon li.t { background: #003a3a; } html.hc .ribbon li.f { background: #3a0000; } html.hc .ribbon li.h { background: #222; }
html.hc .alt { border-left-color: #fff; }
html.hc .tag { border-width: 2px; }
html.hc :focus-visible { outline: 4px solid #ffd400; outline-offset: 2px; }
html.hc .hint, html.hc .muted { color: #f0f0f0; }
@media (max-width: 480px) { .tab { padding: 8px 10px; } .formrow { gap: 6px 12px; } }
@media (forced-colors: active) { .btn.primary { border: 2px solid ButtonText; } .m-fill, .m-eff { background: Highlight; forced-color-adjust: none; } }
</style>
<style>
/* Membrane Arena: extra styles for Quorum Keeper. AGPL-3.0-only. */
.levels { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.levels .btn { min-width: 76px; min-height: 48px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 10px; line-height: 1.15; }
.levels .lvid { font-weight: 700; letter-spacing: 0.06em; }
.levels .lvstars { font-size: 0.85rem; color: var(--gold-bright); letter-spacing: 0.1em; }
.levels .btn[aria-current="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.playgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 12px; }
@media (min-width: 900px) { .playgrid { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); align-items: start; } }
.brief { font-size: 1.05rem; }
.facts { margin: 8px 0; padding-left: 1.1em; color: var(--muted); }
.facts li { margin: 3px 0; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.stepper .slabel { flex: 1 1 14em; font-weight: 600; }
.stepper output { min-width: 2.2em; text-align: center; font-size: 1.25rem; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.btn.step { min-width: 48px; min-height: 48px; padding: 0; font-size: 1.4rem; line-height: 1; }
.cost { margin: 10px 0 4px; font-weight: 600; }
.cost .over, .cost .slow { color: var(--danger); }
.cost .ok { color: var(--aqua); }
.result .stars { font-size: 2rem; letter-spacing: 0.15em; color: var(--gold-bright); margin: 0; min-height: 1.4em; }
#res-text p { margin: 6px 0; }
#res-text .win { color: var(--aqua); font-weight: 700; }
#res-text .lose { color: var(--danger); font-weight: 700; }
.diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #0a1330; }
.diagram svg { display: block; margin: 0 auto; max-width: 100%; height: auto; min-width: 360px; }
.diagram .pickable { cursor: pointer; }
.diagram .pickable:hover .hit { fill-opacity: 0.25; }
.diagram .pickable:focus { outline: none; }
.diagram .pickable:focus-visible .hit { fill: #40d0e0; fill-opacity: 0.35; stroke: #40d0e0; stroke-width: 2; }
.legend { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.88rem; }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 0.7rem; font-weight: 700; color: #06101f; border: 2px solid var(--line); }
.sw-t { background: #2fbf8f; } .sw-f { background: #e2504c; } .sw-n { background: #2a3866; }
.sw-x { border: 3px solid #ffd36b; border-radius: 3px; background: transparent; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: var(--text); }
@media (prefers-reduced-motion: no-preference) {
  .diagram .membrane { transition: opacity 0.2s; }
  .result .stars.pop { animation: qk-pop 0.5s ease-out; }
}
@keyframes qk-pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
html.hc .diagram { background: #000; border: 2px solid #fff; }
html.hc .levels .btn[aria-current="true"] { box-shadow: inset 0 0 0 3px #ffd400; }
html.hc .sw-t { background: #fff; color: #000; } html.hc .sw-f { background: #000; color: #fff; border-color: #fff; } html.hc .sw-n { background: #000; border-color: #fff; }
html.hc .sw-x { border-color: #fff; }
html.hc #res-text .win, html.hc .cost .ok { color: #00ff96; }
</style>

<header class="top">
  <div>
    <h1 data-i18n="page.title">Quorum Keeper</h1>
    <p class="tagline" data-i18n="page.tagline"></p>
  </div>
  <div class="tools">
    <span class="tag" data-i18n="page.tag">SYNTHETIC</span>

    <button id="btn-contrast" class="btn small" type="button" aria-pressed="false" data-i18n="page.hc"></button>
    <a class="btn small" href="brain.html" data-i18n="page.brain"></a>
    <a class="btn small" href="index.html" data-i18n="page.arena"></a>

<noscript><p class="card">This game needs JavaScript. It makes no network requests.</p></noscript>
<main id="main" tabindex="-1">
  <section class="card">
    <p data-i18n="intro.p1"></p>
    <p class="muted" data-i18n="intro.p2"></p>
  </section>
  <nav class="card" aria-labelledby="levels-h">
    <h2 id="levels-h" data-i18n="sec.levels"></h2>
    <h3 data-i18n="group.build"></h3>
    <ul id="lv-build" class="levels"></ul>
    <h3 data-i18n="group.break"></h3>
    <ul id="lv-break" class="levels"></ul>
  </nav>
  <div class="playgrid">
    <section class="card" aria-labelledby="lv-title">
      <h2 id="lv-title"></h2>
      <p id="lv-brief" class="brief"></p>
      <ul id="lv-facts" class="facts"></ul>
      <details id="lv-hint-box"><summary data-i18n="hint.show"></summary><p id="lv-hint"></p></details>

    'how.p3': 'Quand la logique tient, le cerveau tourne avec les vraies membranes apprenantes de l\'arène (règle d\'Oja, observations bruitées) sous le placement qui laisse le moins de marge aux unités honnêtes. Le rappel est la part des épisodes avec motif qui finissent par une vraie sortie. C\'est une seule mesure de {n} épisodes avec graine fixe : un score de jeu, pas une estimation de quoi que ce soit hors de cette simulation.',
    'how.p4': 'Les budgets, cibles et normales viennent d\'une recherche complète des conceptions (scripts/quorum-check.js, docs/quorum-check.txt) : la normale est la conception la moins chère qui atteint la cible de rappel.',
    'share.title': 'Gardien du quorum',
    'share.tag': 'simulation SYNTHÉTIQUE',
    'share.total': '{n} étoiles sur {max}',
    'foot.license': 'Membrane Arena. Copyright (c) 2026 Jean-François Brisson, Spark AI NLP. AGPL-3.0-only. Hors ligne, aucune requête réseau, rien n\'est stocké.'
  };
  return { LANGS: { en: en, fr: fr } };
});

<script>
/*
 * Membrane Arena: Quorum Keeper page (SYNTHETIC classical simulation).
 *
 * Level picker, the Build controls (layer sizes, inhibitory membrane, cost), the Break controls
 * (mark faulty units, attack, claim), the diagram with the released symbols, and the result.
 * The simulation runs a few episodes at a time so the page stays responsive.
 * No network, no storage: progress lives in this page only.

(function () {

  var $ = function (id) { return document.getElementById(id); };
  var hashLv = /(^|[#&])lv=([a-z0-9]+)(&|$)/.exec(location.hash);
  var lang = /(^|[#&])l=fr(&|$)/.test(location.hash) ? 'fr' : 'en', hc = false;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var levelId = hashLv && Q.getLevel(hashLv[2]) ? hashLv[2] : 'b1';
  var designs = {}, picks = {}, best = {}, misses = {}, solutions = {};
  var view = null, result = null, timer = null, anim = null;
  function t(k, vars) { var s = (LANGS[lang] && LANGS[lang][k]) || LANGS.en[k] || k; return G.fmt(s, vars); }

  function text(el, s) { el.textContent = s; }

  function setHash() {
    var h = '#lv=' + levelId + (lang === 'fr' ? '&l=fr' : '');
    if (history.replaceState) history.replaceState(null, '', h);
  }
  /* ---------- words ---------- */
  function threatText(L) {
    var th = L.threat, parts = [];
    if (th.perColumn > 0) parts.push(pl('thr.perColumn', th.perColumn));
    if (th.gates > 0) parts.push(pl('thr.gates', th.gates));
    if (th.integrators > 0) parts.push(pl('thr.integrators', th.integrators));
    if (th.total < 99) parts.push(pl('thr.total', th.total));
    return parts.join('; ');
  }
  function where(arch, faulty) {
    var parts = [], k, i;
    for (k = 0; k < arch.columns; k++) {
      var n = 0;
      for (i = 0; i < arch.perColumn; i++) if (faulty['s' + k + '.' + i]) n++;
      if (n) parts.push(pl('where.sensory', n, { k: k + 1 }));
      if (faulty['g' + k]) parts.push(t('where.gate', { k: k + 1 }));
    }
    for (k = 0; k < arch.integrators; k++) if (faulty['i' + k]) parts.push(t('where.int', { j: k + 1 }));
    return parts.length ? parts.join(', ') : t('where.none');
  }
  function unitLabel(id, kind, bad, cls) {
    var m = /^s(\d+)\.(\d+)$/.exec(id), s;
    if (m) s = t('unit.sensory', { i: +m[2] + 1, k: +m[1] + 1 });
    else if (kind === 'gate') s = t('unit.gate', { k: +id.slice(1) + 1 });
    else if (kind === 'integrator') s = t('unit.integrator', { j: +id.slice(1) + 1 });
    else if (kind === 'output') s = t('unit.output');
    else s = t('unit.inhibitory');
    if (bad) s += t('unit.faulty');
    if (cls === 'true' || cls === 'false' || cls === 'none') s += t('unit.' + cls);
    return s;
  }
  /* ---------- level list and card ---------- */
  function renderLevels() {
    [['build', $('lv-build')], ['break', $('lv-break')]].forEach(function (g) {
      clear(g[1]);
      Q.LEVELS.filter(function (L) { return L.kind === g[0]; }).forEach(function (L) {
        var li = document.createElement('li'), b = document.createElement('button'), a = document.createElement('span'), s = document.createElement('span');
        b.type = 'button'; b.className = 'btn'; b.setAttribute('data-level', L.id);
        a.className = 'lvid'; a.textContent = L.id.toUpperCase();
        s.className = 'lvstars'; s.textContent = starStr(best[L.id] || 0);
        b.appendChild(a); b.appendChild(s);
        b.setAttribute('aria-label', t('lv.aria', { id: L.id.toUpperCase(), title: t(L.id + '.title'), n: best[L.id] || 0 }));
        if (L.id === levelId) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { selectLevel(L.id); });
        li.appendChild(b); g[1].appendChild(li);
      });
    });
  }
  function renderCard() {
    var L = level(), ul = $('lv-facts');
    text($('lv-title'), L.id.toUpperCase() + '. ' + t(L.id + '.title'));
    text($('lv-brief'), t(L.id + '.brief'));
    text($('lv-hint'), t(L.id + '.hint'));
    clear(ul);
    var facts = L.kind === 'build' ? [
      t('fact.threat', { text: threatText(L) }), t('fact.mode', { mode: t('mode.' + L.mode) }),
      t('fact.budget', { budget: L.budget, par: L.par }), t('fact.delays', L.delays),
      t('fact.stars', { r: L.recall.toFixed(2), par: L.par }), t('fact.safe')
    ] : [
      t('fact.goal', { goal: t('goal.' + L.goal) }), t('fact.mode', { mode: t('mode.' + L.mode) }),
      t('fact.pick', { n: L.budget, kinds: L.kinds.map(function (k) { return t('kind.' + k); }).join(', ') }), t('fact.bstars')
    ];
    facts.forEach(function (f) { var li = document.createElement('li'); li.textContent = f; ul.appendChild(li); });
    $('build-controls').hidden = L.kind !== 'build';
    $('break-controls').hidden = L.kind !== 'break';
  }
  /* ---------- diagram ---------- */
  function currentArch() { var L = level(); return L.kind === 'build' ? Q.archFor(L, designs[L.id]) : Q.breakArch(L); }
  function drawDiagram(symOverride) {
    var L = level(), arch = currentArch(), faulty = view ? view.faulty : (L.kind === 'break' ? (picks[L.id] || {}) : {});
    var sym = symOverride !== undefined ? symOverride : (view ? view.sym : null);
    var focused = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute('data-id') : null;
    $('diagram').innerHTML = Q.render(arch, {   // the SVG is built from numbers and escaped strings only (quorum.js render)
      faulty: faulty, sym: sym, hc: hc, pickable: L.kind === 'break' ? L.kinds : [],
      labels: { column: t('kind.column'), gate: t('kind.gate'), integrator: t('kind.integrator'), output: t('kind.output'), inhibitory: t('kind.inhibitory'), T: t('sym.T'), F: t('sym.F') },
      unitLabel: unitLabel, title: t('sec.diagram'), desc: B.describe(arch)
    });
    if (focused) { var el = $('diagram').querySelector('[data-id="' + focused + '"]'); if (el && el.focus) el.focus(); }
  }
  // reveal the released symbols layer by layer: sensory, gates, integrators, output
  function reveal(arch, faulty, sym, done) {
    if (anim) { clearTimeout(anim); anim = null; }
    view = { faulty: faulty, sym: sym };
    if (reduce) { drawDiagram(); if (done) done(); return; }
    var order = [/^s/, /^g/, /^i/, /^o$/], step = 0;
    var tick = function () {
      var part = {};
      Object.keys(sym).forEach(function (id) { for (var q = 0; q <= step; q++) if (order[q].test(id)) part[id] = sym[id]; });
      drawDiagram(part);
      step++;
      if (step < order.length) anim = setTimeout(tick, 260);
      else { anim = null; if (done) done(); }
    };
    tick();
  }
  /* ---------- result ---------- */
  function showResult() {
    var box = $('res-text'), st = $('res-stars'), L = level(), next = $('btn-next');
    clear(box);
    st.classList.remove('pop');
    if (!result || result.level !== L.id) {
      text(st, best[L.id] ? starStr(best[L.id]) : '');
      para(box, t('res.idle'));
      if (best[L.id]) para(box, t('res.best', { n: best[L.id] }), 'muted');
      next.hidden = !best[L.id];
      return;
    }
    var r = result;
    if (r.busy) { text(st, ''); para(box, r.busy === 'search' ? t('status.search') : t('status.sim', { done: r.done, total: r.total })); next.hidden = true; return; }
    text(st, starStr(r.stars || 0));
    if (r.stars && !reduce) { void st.offsetWidth; st.classList.add('pop'); }
    r.lines.forEach(function (ln) { para(box, t(ln[0], ln[1]), ln[2]); });
    if (r.stars) para(box, t('res.stars', { n: r.stars }), 'win');
    if (best[L.id] && best[L.id] > (r.stars || 0)) para(box, t('res.best', { n: best[L.id] }), 'muted');
    next.hidden = !best[L.id];
  }
  function award(id, n) {
    if (n > (best[id] || 0)) best[id] = n;
    renderLevels(); renderShare();
  }
  function renderShare() {
    text($('share'), Q.shareText(Q.LEVELS.map(function (L) { return { id: L.id, stars: best[L.id] || 0 }; }), t));
  }
  /* ---------- build mode ---------- */
  function design() { var L = level(); designs[L.id] = Q.sanitizeDesign(designs[L.id] || L.start, L); return designs[L.id]; }
  function renderDesign() {
    var L = level(), d = design(), lim = Q.DESIGN_LIMITS, arch = Q.archFor(L, d), ck = B.checkArchitecture(arch), c = Q.cost(arch);
    text($('m-val'), String(d.perColumn)); text($('c-val'), String(d.columns)); text($('i-val'), String(d.integrators));
    $('stab').checked = d.stabilizer;
    [['m', 'perColumn', 'design.m'], ['c', 'columns', 'design.C'], ['i', 'integrators', 'design.I']].forEach(function (x) {
      var what = t(x[2]).toLowerCase();
      $(x[0] + '-dec').disabled = d[x[1]] <= 1 || !!timer;
      $(x[0] + '-inc').disabled = d[x[1]] >= lim[x[1]] || !!timer;
      $(x[0] + '-dec').setAttribute('aria-label', t('design.dec', { what: what }));
      $(x[0] + '-inc').setAttribute('aria-label', t('design.inc', { what: what }));
    });
    $('stab').disabled = !!timer;
    var p = $('cost'); clear(p);
    var add = function (s, cls) { var sp = document.createElement('span'); sp.textContent = s; if (cls) sp.className = cls; p.appendChild(sp); p.appendChild(document.createTextNode(' ')); };
    add(t('cost.line', { n: c, budget: L.budget, t: arch.tubes.total }));
    if (c > L.budget) add(t('cost.over', { n: c - L.budget }), 'over');
    else if (c <= L.par) add(t('cost.par'), 'ok');
    else add(t('cost.above', { n: c - L.par }));
    if (!ck.ok) add(t('cost.slow'), 'slow');
    $('btn-test').disabled = !!timer;
  }
  function changeDesign(key, delta) {
    if (timer) return;
    var L = level(), d = design();
    if (key === 'stabilizer') d.stabilizer = !!delta; else d[key] = d[key] + delta;
    designs[L.id] = Q.sanitizeDesign(d, L);
    view = null; if (result && result.level === L.id) result = null;
    renderDesign(); drawDiagram(); showResult();
  }
  function runTest() {
    if (timer) return;
    var L = level(), ev = Q.evaluateBuild(L, design()), lines = [];
    if (!ev.check.ok) {
      var msgs = ev.check.problems.filter(function (p) { return p.level === 'error'; }).map(function (p) { return p.code === 'deadline' ? t('cost.slow') : p.code; });
      result = { level: L.id, stars: 0, lines: [['res.wiring', { msg: msgs.join(' ') }, 'lose']] }; showResult(); return;
    }
    if (ev.overBudget) { result = { level: L.id, stars: 0, lines: [['res.budget', { n: ev.cost, budget: L.budget }, 'lose']] }; showResult(); return; }
    var adv = ev.adversary;
    if (!adv.holds) {
      var w = adv.worst, fooled = !!adv.fool;
      lines.push([fooled ? 'res.fooled' : 'res.silenced', { count: fooled ? adv.counts['false'] : adv.counts.none, total: adv.total, where: where(ev.arch, w.faulty) }, 'lose']);
      result = { level: L.id, stars: 0, lines: lines };
      reveal(ev.arch, w.faulty, w.eval.sym, showResult);
      return;
    }
    lines.push(['res.holds', { total: adv.total }, 'win']);
    var R = Q.createSim(L, ev), total = R.opts.episodes, prog = $('sim-progress');
    prog.max = total; prog.value = 0;
    result = { level: L.id, busy: 'sim', done: 0, total: total };
    var place = ev.simPlacement || {}, symb = Q.evaluate(ev.arch, L.mode, place).sym;
    view = { faulty: place, sym: null }; drawDiagram();
    var slice = function () {
      var s0 = performance.now();
      while (!B.brainDone(R) && performance.now() - s0 < 14) B.stepBrainRun(R, 1);
      prog.value = R.e;
      if (!B.brainDone(R)) { result.done = R.e; showResult(); timer = setTimeout(slice, 0); return; }
      timer = null;
      var sum = B.finishBrainRun(R).summary, sc = Q.scoreBuild(L, ev, sum);
      lines.push(['res.sim', { n: total, seed: L.seed, where: where(ev.arch, place), r: sum.recall.p.toFixed(2), target: L.recall.toFixed(2), F: sum.F }]);
      if (sum.F > 0) lines.push(['res.simFalse', { F: sum.F }, 'lose']);
      else if (sc.stars === 1) lines.push(['res.missRecall', {}]);
      else if (sc.stars === 2) lines.push(['res.missPar', { n: ev.cost, par: L.par }]);
      else if (sc.stars === 3) lines.push(['res.perfect', {}]);
      result = { level: L.id, stars: sc.stars, lines: lines };
      award(L.id, sc.stars);
      renderDesign();
      reveal(ev.arch, place, symb, showResult);
    };
    renderDesign(); showResult();
    timer = setTimeout(slice, 0);
  }
  /* ---------- break mode ---------- */
  function solution(L) { if (!solutions[L.id]) solutions[L.id] = Q.solveBreak(L); return solutions[L.id]; }
  function renderPicked() {
    var L = level(), n = Object.keys(picks[L.id] || {}).length;
    text($('picked'), t('picked', { n: n, k: L.budget }));
    $('btn-solution').hidden = !(misses[L.id] > 0);
  }
  function toggleUnit(id) {
    var L = level();
    if (L.kind !== 'break') return;
    var arch = Q.breakArch(L), unit = arch.membranes.filter(function (x) { return x.id === id; })[0];
    if (!unit) return;
    var cur = Object.assign({}, picks[L.id] || {});
    if (view) { view = null; result = null; }
    if (!Q.canPick(L, unit.kind)) { result = { level: L.id, stars: 0, lines: [['pick.shielded', {}]] }; drawDiagram(); showResult(); return; }
    if (cur[id]) delete cur[id];
    else if (Object.keys(cur).length >= L.budget) { result = { level: L.id, stars: 0, lines: [['pick.full', { k: L.budget }]] }; drawDiagram(); showResult(); return; }
    else cur[id] = true;
    picks[L.id] = cur;
    renderPicked(); drawDiagram(); showResult();
  }
  function winBreak(L, used, lines) {
    var sol = solution(L), sc = Q.scoreBreak(L, sol, { won: true, misses: misses[L.id] || 0, used: used });
    if (sol.breakable && used > sol.minFaults) lines.push(['res.min', { n: sol.minFaults }]);
    result = { level: L.id, stars: sc.stars, lines: lines };
    award(L.id, sc.stars);
  }
  function doAttack() {
    var L = level(), p = picks[L.id] || {};
    if (!Object.keys(p).length) { result = { level: L.id, stars: 0, lines: [['res.bempty', {}]] }; showResult(); return; }
    var r = Q.attack(L, p);
    if (r.win) winBreak(L, r.used, [['res.bwin.' + L.goal, { n: r.used }, 'win']]);
    else {
      misses[L.id] = (misses[L.id] || 0) + 1;
      result = { level: L.id, stars: 0, lines: [['res.blose', { outcome: t('outcome.' + r.outcome) }, 'lose']] };
    }
    renderPicked();
    reveal(r.arch, r.faulty, r.eval.sym, showResult);
  }
  function doClaim() {
    var L = level(), sol = solution(L);
    view = null;
    if (!sol.breakable) winBreak(L, 0, [['res.claimRight', { total: sol.total }, 'win']]);
    else { misses[L.id] = (misses[L.id] || 0) + 1; result = { level: L.id, stars: 0, lines: [['res.claimWrong', {}, 'lose']] }; }
    renderPicked(); drawDiagram(); showResult();
  }
  function doSolution() {
    var L = level(), sol = solution(L);
    if (!sol.breakable) { result = { level: L.id, stars: 0, lines: [['res.claimRight', { total: sol.total }]] }; view = null; drawDiagram(); showResult(); return; }
    picks[L.id] = Object.assign({}, sol.example);
    var r = Q.attack(L, picks[L.id]);
    result = { level: L.id, stars: 0, lines: [['res.shown', { n: sol.minFaults, where: where(r.arch, r.faulty) }]] };
    renderPicked();
    reveal(r.arch, r.faulty, r.eval.sym, showResult);
  }
  function doClear() { var L = level(); picks[L.id] = {}; view = null; result = null; renderPicked(); drawDiagram(); showResult(); }
  /* ---------- wiring ---------- */
  function selectLevel(id) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (anim) { clearTimeout(anim); anim = null; }
    levelId = id; view = null; result = null;
    setHash(); renderAll();
  }
  function renderAll() {
    renderLevels(); renderCard();
    if (level().kind === 'build') renderDesign(); else renderPicked();
    drawDiagram(); showResult(); renderShare();
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.sw-t').forEach(function (el) { el.textContent = t('sym.T'); });
    document.querySelectorAll('.sw-f').forEach(function (el) { el.textContent = t('sym.F'); });
    text($('how-p3'), t('how.p3', { n: Q.SIM_EPISODES }));
    document.title = t('page.title');
    text($('footer-version'), 'quorum ' + Q.VERSION + ' / brain ' + B.VERSION + ' / arena ' + G.BUILD);
    setHash(); renderAll();
  }
  $('m-dec').addEventListener('click', function () { changeDesign('perColumn', -1); });
  $('m-inc').addEventListener('click', function () { changeDesign('perColumn', 1); });
  $('c-dec').addEventListener('click', function () { changeDesign('columns', -1); });
  $('c-inc').addEventListener('click', function () { changeDesign('columns', 1); });
  $('i-dec').addEventListener('click', function () { changeDesign('integrators', -1); });
  $('i-inc').addEventListener('click', function () { changeDesign('integrators', 1); });
  $('stab').addEventListener('change', function () { changeDesign('stabilizer', this.checked); });
  $('btn-test').addEventListener('click', runTest);
  $('btn-attack').addEventListener('click', doAttack);
  $('btn-claim').addEventListener('click', doClaim);
  $('btn-clear').addEventListener('click', doClear);
  $('btn-solution').addEventListener('click', doSolution);
  $('btn-next').addEventListener('click', function () {
    var i = Q.LEVELS.indexOf(level());
    selectLevel(Q.LEVELS[(i + 1) % Q.LEVELS.length].id);
  });
  var unitFrom = function (ev) { var el = ev.target && ev.target.closest ? ev.target.closest('.membrane') : null; return el ? el.getAttribute('data-id') : null; };
  $('diagram').addEventListener('click', function (ev) { var id = unitFrom(ev); if (id) toggleUnit(id); });
  $('diagram').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var id = unitFrom(ev); if (!id) return;
    ev.preventDefault(); toggleUnit(id);
  });
  $('btn-lang').addEventListener('click', function () { lang = lang === 'en' ? 'fr' : 'en'; applyLang(); });
  $('btn-contrast').addEventListener('click', function () {
    hc = !hc;
    document.documentElement.classList.toggle('hc', hc);
    this.setAttribute('aria-pressed', hc ? 'true' : 'false');
    drawDiagram();
  });
  applyLang();
})();

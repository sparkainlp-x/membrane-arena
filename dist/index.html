<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Membrane Arena: an offline, synthetic, classical-simulation game about three coupled membranes, reward schemes, a 2-of-3 shield, an amplifier and a stabilizer.">
<title>Membrane Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1330'/%3E%3Ccircle cx='16' cy='9' r='5' fill='none' stroke='%2340d0e0' stroke-width='2'/%3E%3Ccircle cx='9' cy='21' r='5' fill='none' stroke='%237aa8ff' stroke-width='2'/%3E%3Ccircle cx='23' cy='21' r='5' fill='none' stroke='%23c9a84c' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0a1330;
  --bg2: #101c40;
  --panel: #12204a;
  --line: #2a3b6e;
  --text: #eef2ff;
  --muted: #b3bedb;
  --gold: #c9a84c;
  --gold-bright: #e0c36a;
  --cyan: #40d0e0;
  --blue: #7aa8ff;
  --aqua: #5ee6b8;
  --danger: #ff9a9a;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: radial-gradient(1400px 700px at 50% -10%, #16275a 0%, var(--bg) 60%) fixed;
  color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 12px 28px;
}
.skip { position: absolute; left: -999px; top: 0; background: var(--gold); color: #0a1330; padding: 8px 12px; z-index: 30; }
.skip:focus { left: 8px; top: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top, main, .foot { width: 100%; max-width: 1180px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 0 6px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.7rem; letter-spacing: 0.22em; color: var(--gold); font-weight: 700; }
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { border: 1px solid var(--cyan); color: var(--cyan); border-radius: 999px; padding: 2px 10px; font-size: 0.72rem; letter-spacing: 0.08em; }
main { outline: none; }
.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; min-width: 0; }
[hidden] { display: none !important; }
h2 { margin: 0 0 6px; font-size: 1.2rem; color: var(--gold-bright); }
h3 { margin: 16px 0 6px; font-size: 1rem; color: var(--gold-bright); }
h4 { margin: 0 0 4px; font-size: 1rem; color: var(--cyan); }
h2:focus, h2[tabindex="-1"]:focus { outline: none; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small-text { font-size: 0.85rem; }
.hint { color: var(--muted); font-size: 0.84rem; margin: 2px 0 10px; }
.beat { color: var(--cyan); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: #1a2a5c; color: var(--text); padding: 12px 16px;
  min-height: 44px; border-radius: 10px; font: inherit; cursor: pointer; touch-action: manipulation;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--gold); color: #0a1330; border-color: var(--gold); font-weight: 700; }
.btn.primary:hover { background: var(--gold-bright); }
.btn.small { padding: 6px 12px; min-height: 40px; font-size: 0.9rem; }
.btn[aria-pressed="true"] { border-color: var(--cyan); background: #12426a; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

.col-main { min-width: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 14px; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); align-items: start; } }

.hud { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.92rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.hud-item { color: var(--muted); } .hud-item b { color: var(--text); }
.c-true { color: var(--cyan) !important; } .c-false { color: var(--danger) !important; } .c-gold { color: var(--gold-bright) !important; }
.canvas-wrap { position: relative; width: 100%; aspect-ratio: 16 / 10; background: #070e26; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (max-width: 640px) { .canvas-wrap { aspect-ratio: 1 / 1.05; } }
#arena { width: 100%; height: 100%; display: block; }
.canvas-msg { position: absolute; left: 12px; right: 12px; bottom: 8px; margin: 0; font-size: 0.85rem; color: var(--muted); }
.ribbon { list-style: none; display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0 0; padding: 0; }
.ribbon li { height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #0d1840; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--muted); }
.ribbon li.planted { border-style: solid; }
.ribbon li.noise { border-style: dashed; }
.ribbon li.t { background: #0f4b5a; border-color: var(--cyan); color: var(--text); }
.ribbon li.f { background: #4b2a34; border-color: var(--danger); color: var(--text); }
.ribbon li.h { background: #2a3350; border-color: var(--muted); color: var(--text); }
.ribbon li.cur { box-shadow: 0 0 0 2px var(--gold); }
.ticker { min-height: 1.5em; margin: 8px 0 0; color: var(--gold-bright); font-size: 0.92rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.inline { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); }
select {
  background: #0d1840; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; font: inherit; max-width: 100%;
}
.field { margin: 14px 0; }
.field > label { display: block; margin: 0 0 4px; font-weight: 600; }
.field select { width: 100%; }
.sliderrow { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
.sliderrow label { flex: 0 0 9.5em; margin: 0; }
.sliderrow .end { font-size: 0.8rem; color: var(--muted); }
input[type=range] { flex: 1; min-width: 110px; min-height: 44px; accent-color: var(--gold); }
output { min-width: 4ch; text-align: right; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.switch { display: flex; gap: 10px; align-items: center; min-height: 44px; margin: 6px 0 0; font-weight: 600; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }
.switches .hint { margin-left: 32px; }
details summary { cursor: pointer; padding: 8px 0; color: var(--cyan); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details[disabled] input { opacity: .5; }

.meters-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .meters-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.meter-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.m-name { width: 1.4em; font-weight: 700; color: var(--gold-bright); }
.meter { position: relative; flex: 1; height: 18px; background: #070e26; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.m-band { position: absolute; top: 0; bottom: 0; left: calc(0.33 / 3.2 * 100%); width: calc((3 - 0.33) / 3.2 * 100%); background: rgba(64, 208, 224, 0.12); border-left: 1px dashed var(--cyan); border-right: 1px dashed var(--cyan); }
.meter.off .m-band { display: none; }
.m-fill { position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; background: var(--cyan); border-radius: 6px; }
.m-fill.rate { background: var(--gold); }
.m-eff { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--text); left: 0; }
.m-tick { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--muted); }
.meter.clamped { border-color: var(--danger); }
.m-val { width: 9.5em; white-space: nowrap; text-align: right; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: 190px; background: #070e26; border: 1px solid var(--line); border-radius: 10px; display: block; }
.chart.tall { height: 340px; }
.key { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--cyan); vertical-align: middle; margin-right: 6px; }
.key-base { border-top: 3px dashed var(--gold); margin-left: 14px; }

.big { font-size: 1.6rem; font-weight: 700; color: var(--gold-bright); margin: 4px 0 8px; }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 9.5em 1fr 6.8em; gap: 10px; align-items: center; font-size: 0.9rem; }
.part .bar { height: 10px; background: #070e26; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.part .bar span { display: block; height: 100%; background: var(--cyan); }
.part .v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
.tablewrap { overflow-x: auto; }
.scores { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.scores th, .scores td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.scores th:first-child, .scores td:first-child { text-align: left; white-space: normal; }
.scores th { color: var(--cyan); font-weight: 600; }
.lesson { margin-top: 14px; padding: 12px; border: 1px solid var(--gold); border-radius: 10px; background: #0e1a3d; }
.lesson h3 { margin-top: 0; }
pre {
  white-space: pre-wrap; word-break: break-word; background: #070e26; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font: 0.9rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
}
.stats { list-style: none; margin: 0; padding: 0; color: var(--muted); }
.stats li { padding: 2px 0; }
.modal { position: fixed; inset: 0; background: rgba(4, 8, 20, 0.82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-box { max-width: 560px; max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius); padding: 18px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
.foot p { margin: 4px 0; }
@media (max-width: 480px) { .sliderrow label { flex-basis: 100%; } .part { grid-template-columns: 7em 1fr 6.8em; } h1 { font-size: 1.35rem; } }
@media (prefers-reduced-motion: no-preference) {
  .m-fill { transition: width 0.25s ease; }
  .m-eff { transition: left 0.25s ease; }
  .card { animation: rise 0.25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (forced-colors: active) { .btn.primary { border: 2px solid ButtonText; } .m-fill, .m-eff { background: Highlight; forced-color-adjust: none; } }
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to the game</a>
<header class="top">
  <div class="brand">
    <h1 id="app-title" data-i18n="app.title">MEMBRANE ARENA</h1>
    <p class="tagline" data-i18n="app.tagline"></p>
  </div>
  <div class="tools">
    <span class="tag" data-i18n="tag.synthetic"></span>
    <button id="btn-lang" class="btn small" type="button"></button>
    <button id="btn-help" class="btn small" type="button" aria-haspopup="dialog" data-i18n="btn.help"></button>
  </div>
</header>
<noscript><p class="card" data-i18n="err.noscript">This game needs JavaScript. It makes no network requests.</p></noscript>

<main id="main" tabindex="-1">
  <section class="card intro" aria-labelledby="intro-title">
    <h2 id="intro-title" data-i18n="intro.title"></h2>
    <p data-i18n="intro.body"></p>
    <p class="muted small-text" data-i18n="intro.source"></p>
    <p id="mode-line" class="beat"></p>
    <p id="daily-done" class="muted" hidden></p>
    <div class="row">
      <button id="btn-daily" class="btn small" type="button" data-i18n="btn.daily"></button>
      <button id="btn-practice" class="btn small" type="button" data-i18n="btn.practice"></button>
    </div>
  </section>

  <div class="layout">
    <div class="col-main">
    <section class="card stage" aria-labelledby="stage-title">
      <h2 id="stage-title" class="sr-only" data-i18n="app.title"></h2>
      <div class="hud">
        <span id="hud-gen" class="hud-item"></span>
        <span id="hud-ep" class="hud-item"></span>
        <span class="hud-item"><span data-i18n="hud.true"></span> <b id="hud-true" class="c-true">0</b></span>
        <span class="hud-item"><span data-i18n="hud.false"></span> <b id="hud-false" class="c-false">0</b></span>
        <span class="hud-item"><span data-i18n="hud.precision"></span> <b id="hud-prec">-</b></span>
        <span class="hud-item"><span data-i18n="hud.score"></span> <b id="hud-score" class="c-gold">-</b></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="arena" role="img" aria-label=""></canvas>
        <p id="canvas-msg" class="canvas-msg" hidden></p>
      </div>
      <ol id="ribbon" class="ribbon" aria-label=""></ol>
      <p id="ticker" class="ticker" aria-hidden="true"></p>
      <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <div class="controls">
        <button id="btn-run" class="btn primary" type="button"></button>
        <button id="btn-step" class="btn" type="button" data-i18n="btn.step"></button>
        <button id="btn-finish" class="btn" type="button" data-i18n="btn.finish"></button>
        <label class="inline" for="speed"><span data-i18n="speed.label"></span>
          <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select>
        </label>
        <button id="btn-science" class="btn" type="button" aria-pressed="false"></button>
      </div>
      <p id="hud-pending" class="muted small-text" hidden data-i18n="hud.pending"></p>
    </section>

    <section id="panel-meters" class="card" aria-labelledby="meters-title">
      <h2 id="meters-title" data-i18n="meters.title"></h2>
      <div class="meters-grid">
        <div>
          <div class="meter-row"><span class="m-name">A</span><div id="m-gain-0" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-0" class="m-fill"></span><span id="m-eff-0" class="m-eff"></span></div><span id="m-val-0" class="m-val"></span></div>
          <div class="meter-row"><span class="m-name">B</span><div id="m-gain-1" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-1" class="m-fill"></span><span id="m-eff-1" class="m-eff"></span></div><span id="m-val-1" class="m-val"></span></div>
          <div class="meter-row"><span class="m-name">C</span><div id="m-gain-2" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-2" class="m-fill"></span><span id="m-eff-2" class="m-eff"></span></div><span id="m-val-2" class="m-val"></span></div>
          <div class="meter-row"><span class="m-name">R</span><div id="m-rate" class="meter" role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5"><span class="m-tick"></span><span id="m-rate-fill" class="m-fill rate"></span></div><span id="m-rate-val" class="m-val"></span></div>
          <p id="m-state" class="muted small-text"></p>
          <p class="hint" data-i18n="meters.help"></p>
        </div>
        <div>
          <h3 data-i18n="fit.title"></h3>
          <canvas id="fit" class="chart" role="img" aria-label=""></canvas>
          <p class="hint" data-i18n="fit.help"></p>
        </div>
      </div>
    </section>

    <section id="panel-science" class="card" aria-labelledby="sci-title" hidden>
      <h2 id="sci-title" data-i18n="sci.title"></h2>
      <p class="small-text"><span class="key key-prec"></span><span data-i18n="sci.prec"></span> <span class="key key-base"></span><span data-i18n="sci.base"></span></p>
      <canvas id="sci" class="chart tall" role="img" aria-label=""></canvas>
      <p class="small-text" data-i18n="sci.events"></p>
      <p id="sci-base" class="hint"></p>
      <p class="hint" data-i18n="sci.help"></p>
    </section>

    </div>

    <section class="card setup" aria-labelledby="setup-title">
      <h2 id="setup-title" data-i18n="setup.title"></h2>
      <p class="muted small-text" data-i18n="setup.note"></p>

      <div class="field">
        <label for="scheme" data-i18n="scheme.label"></label>
        <select id="scheme"></select>
        <p id="scheme-desc" class="hint" data-i18n="scheme.desc"></p>
      </div>

      <div class="field">
        <label for="w" data-i18n="w.label"></label>
        <div class="sliderrow"><span class="end" data-i18n="w.comp"></span>
          <input id="w" type="range" min="0" max="1" step="0.25" value="0.5">
          <span class="end" data-i18n="w.coop"></span><output id="w-val" for="w">50%</output></div>
        <p class="hint" data-i18n="w.help"></p>
      </div>

      <div class="field switches">
        <label class="switch"><input id="t-shield" type="checkbox" checked><span data-i18n="shield.label"></span></label>
        <p class="hint" data-i18n="shield.help"></p>
        <label class="switch"><input id="t-amp" type="checkbox"><span data-i18n="amp.label"></span></label>
        <p class="hint" data-i18n="amp.help"></p>
        <label class="switch"><input id="t-stab" type="checkbox"><span data-i18n="stab.label"></span></label>
        <p class="hint" data-i18n="stab.help"></p>
        <label class="switch"><input id="t-evolve" type="checkbox" checked><span data-i18n="evolve.label"></span></label>
        <p class="hint" data-i18n="evolve.help"></p>
      </div>

      <details id="adv" class="field">
        <summary data-i18n="adv.title"></summary>
        <p class="hint" data-i18n="start.note"></p>
        <div class="sliderrow"><label for="th" data-i18n="th.label"></label><input id="th" type="range" min="0.1" max="1.2" step="0.01" value="0.5"><output id="th-val" for="th"></output></div>
        <div class="sliderrow"><label for="c" data-i18n="c.label"></label><input id="c" type="range" min="0" max="0.5" step="0.01" value="0.05"><output id="c-val" for="c"></output></div>
        <div class="sliderrow"><label for="g" data-i18n="g.label"></label><input id="g" type="range" min="0.5" max="2" step="0.01" value="1"><output id="g-val" for="g"></output></div>
        <p id="adv-locked" class="hint" hidden data-i18n="adv.locked"></p>
        <button id="btn-defaults" class="btn small" type="button" data-i18n="btn.defaults"></button>
        <div class="sliderrow"><label for="fcost" data-i18n="fcost.label"></label><input id="fcost" type="range" min="0" max="2" step="0.25" value="0"><output id="fcost-val" for="fcost"></output></div>
        <p class="hint" data-i18n="fcost.help"></p>
      </details>
      <p id="cfg-note" class="hint"></p>
    </section>
  </div>

  <section id="s-result" class="card result" aria-labelledby="result-title" tabindex="-1" hidden>
    <h2 id="result-title" tabindex="-1" data-i18n="result.title"></h2>
    <p id="result-score" class="big"></p>
    <div id="parts" class="parts"></div>
    <p class="hint" data-i18n="result.formula"></p>

    <h3 data-i18n="cmp.title"></h3>
    <div class="tablewrap"><table id="cmp" class="scores"></table></div>
    <p id="cmp-note" class="hint"></p>
    <p id="challenge-result" class="beat" hidden></p>
    <details class="field"><summary data-i18n="cmp.schemes"></summary>
      <div class="tablewrap"><table id="schemes-table" class="scores"></table></div>
      <p id="schemes-source" class="hint"></p>
    </details>

    <div class="lesson" id="lesson-box">
      <h3 data-i18n="lesson.title"></h3>
      <h4 id="lesson-title"></h4>
      <p id="lesson-body"></p>
      <button id="btn-lesson-more" class="btn small" type="button" data-i18n="lesson.more"></button>
    </div>

    <h3 data-i18n="params.title"></h3>
    <ul id="params" class="stats"></ul>

    <h3 data-i18n="share.title_label"></h3>
    <pre id="share-text" tabindex="0"></pre>
    <div class="row">
      <button id="btn-copy" class="btn primary" type="button" data-i18n="btn.copy"></button>
      <button id="btn-link" class="btn" type="button" data-i18n="btn.link"></button>
      <button id="btn-again" class="btn" type="button" data-i18n="btn.again"></button>
    </div>
    <p id="copy-status" class="muted" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="stats-title">
    <h2 id="stats-title" data-i18n="stats.title"></h2>
    <ul id="stats-list" class="stats"></ul>
    <p id="store-warn" class="hint" hidden data-i18n="store.warn"></p>
  </section>

    cmp.appendChild(row([t('cmp.score'), String(Math.round(r.score)), bs === null ? '-' : String(Math.round(bs))]));
    var note = '';
    if (b) note = t('cmp.source', { file: b.file, seeds: rr.seeds, repo: B.SOURCE.repo, commit: B.SOURCE.commit.slice(0, 7) }) + (b.exactW ? '' : ' ' + t('cmp.nearw', { w: b.w }));
    else note = t('cmp.none');
    var mixed = hist.some(function (h) { return G.cfgTag(h.settings) !== G.cfgTag(lastS); });
    if (mixed) note += ' ' + t('cmp.mixed');
    $('cmp-note').textContent = note;
    var ch = $('challenge-result');
    if (seedInfo.mode === 'challenge' && seedInfo.best !== null) {
      ch.hidden = false;
      ch.textContent = Math.round(r.score) > seedInfo.best ? t('result.beat', { best: seedInfo.best }) : t('result.notbeat', { best: seedInfo.best, score: Math.round(r.score) });
    } else ch.hidden = true;
    var sc = $('schemes-table'); sc.innerHTML = '';
    sc.appendChild(row([t('scheme.label'), t('cmp.true'), t('cmp.false'), t('cmp.precision')], true));
    B.SCHEMES32.forEach(function (s) { sc.appendChild(row([t('scheme.' + s.scheme + '.short'), String(s.T), String(s.F), String(s.P)])); });
    $('schemes-source').textContent = t('cmp.schemes_source', { file: t('cmp.schemes_file') });
    renderLesson();
    var ul = $('params'); ul.innerHTML = '';
    var p0 = hist[0].params, p1 = contest.par;
    for (i = 0; i < 3; i++) {
      var li = document.createElement('li');
      li.textContent = t('params.line', { m: 'ABC'.charAt(i), th0: r2(p0[i].th), th1: r2(p1[i].th), c0: r2(p0[i].c), c1: r2(p1[i].c), g0: r2(p0[i].g), g1: r2(p1[i].g) });
      ul.appendChild(li);
    }
    $('share-text').textContent = shareText();
  }
  function renderLesson() {
    var id = G.LESSON_IDS[((lessonIdx % G.LESSON_IDS.length) + G.LESSON_IDS.length) % G.LESSON_IDS.length];
    $('lesson-title').textContent = t('lesson.' + id + '.title');
    $('lesson-body').textContent = G.fmt(t('lesson.' + id + '.body'), G.lessonVars());
  }
  function challengeUrl() {
    var h = contest ? contest.hist : [], s = h.length ? h[h.length - 1].settings : readSettings();
    var o = { settings: s, best: lastResult ? lastResult.score : null, lang: lang };
    if (seedInfo.date) o.date = seedInfo.date; else o.seed = seedInfo.seed;
    var base = window.location.href.split('#')[0];
    return base + G.buildChallengeHash(o);
  }
  function shareText() {
    var h = contest.hist, s = h[h.length - 1].settings, b = G.baselineFor(s);
    return G.buildShare({
      labels: labelsTable(), seed: seedInfo.date ? null : seedInfo.seed, day: seedInfo.date ? G.dayNumber(seedInfo.date) : 0, date: seedInfo.date,
      result: lastResult, settings: s, ref: b ? G.baselineScore(b) : null, url: challengeUrl()
    });
  }
  function copyText(text) {
    var st = $('copy-status');
    function fail() { st.textContent = t('copy.fail'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { st.textContent = t('copied'); }, fail);
      else fail();
    } catch (e) { fail(); }
  }

  function renderStats() {
    var ul = $('stats-list'); ul.innerHTML = '';
    var dates = Object.keys(store.daily), li;
    if (!dates.length) { li = document.createElement('li'); li.textContent = t('stats.none'); ul.appendChild(li); }
    else {
      var st = G.computeStreak(dates, today());
      li = document.createElement('li'); li.textContent = t('stats.streak', { cur: st.current, best: st.best }); ul.appendChild(li);
      li = document.createElement('li'); li.textContent = t('stats.best', { best: Math.round(store.bestDaily === null ? 0 : store.bestDaily) }); ul.appendChild(li);
    }
    $('store-warn').hidden = storeOk;
  }

  /* ---------- help dialog, keys ---------- */

  var lastFocus = null;
  function openHelp() { lastFocus = document.activeElement; $('help').hidden = false; $('help-title').focus(); }
  function closeHelp() { $('help').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function onKey(e) {
    if (e.key === 'Escape' && !$('help').hidden) { closeHelp(); return; }
    if (!$('help').hidden && e.key === 'Tab') {
      var f = $('help').querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (f.length) { var first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey || !$('help').hidden) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SUMMARY' || tag === 'A') return;
    if (e.key === ' ') { e.preventDefault(); onRun(); }
    else if (e.key === 'g' || e.key === 'G') onStep();
    else if (e.key === 'f' || e.key === 'F') onFinish();
    else if (e.key === 's' || e.key === 'S') toggleScience();
  }
  function toggleScience() { science = !science; $('panel-science').hidden = !science; renderControls(); drawCharts(); }

  /* ---------- boot ---------- */

  function init() {
    store = loadStore();
    if (store.lang && I.supported.indexOf(store.lang) >= 0) lang = store.lang;
    else if (/^fr/i.test(navigator.language || '')) lang = 'fr';
    t = I.make(lang);
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    try { arena = S.createArena($('arena'), { reduced: reduced }); } catch (e) { arena = null; showCanvasError(); }
    if (arena) arena.setSpeed($('speed').value);
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      var onMq = function () { reduced = mq.matches; if (arena) arena.setReduced(reduced); };
      if (mq.addEventListener) mq.addEventListener('change', onMq);
    }
    $('btn-lang').addEventListener('click', function () { lang = lang === 'en' ? 'fr' : 'en'; t = I.make(lang); store.lang = lang; saveStore(); applyI18n(); });
    $('btn-help').addEventListener('click', openHelp);
    $('btn-help-close').addEventListener('click', closeHelp);
    $('help').addEventListener('click', function (e) { if (e.target === $('help')) closeHelp(); });
    $('btn-daily').addEventListener('click', function () { if (window.location.hash) { history.replaceState(null, '', window.location.pathname + window.location.search); } startDaily(); applyI18n(); });
    $('btn-practice').addEventListener('click', function () { startPractice(); applyI18n(); });
    $('btn-run').addEventListener('click', onRun);
    $('btn-step').addEventListener('click', onStep);
    $('btn-finish').addEventListener('click', onFinish);
    $('btn-again').addEventListener('click', function () { resetRun(); beginRun(); if (!arena) onFinish(); });
    $('btn-science').addEventListener('click', toggleScience);
    $('speed').addEventListener('change', function () { if (arena) arena.setSpeed($('speed').value); });
    ['scheme', 'w', 'th', 'c', 'g', 'fcost', 't-shield', 't-amp', 't-stab', 't-evolve'].forEach(function (id) {
      $(id).addEventListener('input', onControlChange); $(id).addEventListener('change', onControlChange);
    });
    $('btn-defaults').addEventListener('click', function () { setSlider('th', G.DEFAULTS.th); setSlider('c', G.DEFAULTS.c); setSlider('g', G.DEFAULTS.g); onControlChange(); });
    $('btn-lesson-more').addEventListener('click', function () { lessonIdx++; renderLesson(); });
    $('btn-copy').addEventListener('click', function () { copyText($('share-text').textContent); });
    $('btn-link').addEventListener('click', function () { copyText(challengeUrl()); });
    window.addEventListener('keydown', onKey);
    window.addEventListener('hashchange', function () { applyHash(); });
    var rz = function () { if (arena) arena.resize(); drawCharts(); };
    if (window.ResizeObserver) new ResizeObserver(rz).observe($('arena')); else window.addEventListener('resize', rz);
    document.addEventListener('visibilitychange', function () { lastTs = 0; });
    buildSchemeOptions();
    applyHash();
    window.__arena = {
      stats: function () { return arena ? arena.stats() : null; }, resetStats: function () { if (arena) arena.resetStats(); },
      contest: function () { return contest; }, mode: function () { return mode; }, lang: function () { return lang; },
      result: function () { return lastResult; }, seed: function () { return seedInfo; }
    };
    window.requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Membrane Arena: an offline, synthetic, classical-simulation game about three coupled membranes, reward schemes, a 2-of-3 shield, an amplifier and a stabilizer.">
<title>Membrane Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1330'/%3E%3Ccircle cx='16' cy='9' r='5' fill='none' stroke='%2340d0e0' stroke-width='2'/%3E%3Ccircle cx='9' cy='21' r='5' fill='none' stroke='%237aa8ff' stroke-width='2'/%3E%3Ccircle cx='23' cy='21' r='5' fill='none' stroke='%23c9a84c' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to the game</a>
<header class="top">
  <div class="brand">
    <h1 id="app-title" data-i18n="app.title">MEMBRANE ARENA</h1>
    <p class="tagline" data-i18n="app.tagline"></p>
  </div>
  <div class="tools">
    <span class="tag" data-i18n="tag.synthetic"></span>
    <button id="btn-lang" class="btn small" type="button"></button>
    <button id="btn-motion" class="btn small" type="button" aria-pressed="true"></button>
    <button id="btn-contrast" class="btn small" type="button" aria-pressed="false"></button>
    <button id="btn-intro" class="btn small" type="button" data-i18n="btn.intro"></button>
    <button id="btn-help" class="btn small" type="button" aria-haspopup="dialog" data-i18n="btn.help"></button>
  </div>
</header>
<noscript><p class="card" data-i18n="err.noscript">This game needs JavaScript. It makes no network requests.</p></noscript>

<main id="main" tabindex="-1">
  <section class="card intro" aria-labelledby="intro-title">
    <h2 id="intro-title" data-i18n="intro.title"></h2>
    <p data-i18n="intro.body"></p>
    <p class="muted small-text" data-i18n="intro.source"></p>
    <p id="mode-line" class="beat"></p>
    <p id="daily-done" class="muted" hidden></p>
    <div class="row">
      <button id="btn-daily" class="btn small" type="button" data-i18n="btn.daily"></button>
      <button id="btn-practice" class="btn small" type="button" data-i18n="btn.practice"></button>
    </div>
  </section>

  <section id="tutorial" class="card tour" aria-labelledby="tut-title" hidden>
    <h2 id="tut-title" data-i18n="tut.title"></h2>
    <p id="tut-step" class="muted small-text"></p>
    <p id="tut-text"></p>
    <div class="row">
      <button id="btn-tut-next" class="btn primary small" type="button"></button>
      <button id="btn-tut-skip" class="btn small" type="button" data-i18n="tut.skip"></button>
    </div>
  </section>

  <div class="layout">
    <div class="col-main">
    <section class="card stage" aria-labelledby="stage-title">
      <h2 id="stage-title" class="sr-only" data-i18n="app.title"></h2>
      <div class="hud">
        <span id="hud-gen" class="hud-item"></span>
        <span id="hud-ep" class="hud-item"></span>
        <span class="hud-item"><span data-i18n="hud.true"></span> <b id="hud-true" class="c-true">0</b></span>
        <span class="hud-item"><span data-i18n="hud.false"></span> <b id="hud-false" class="c-false">0</b></span>
        <span class="hud-item"><span data-i18n="hud.precision"></span> <b id="hud-prec">-</b></span>
        <span class="hud-item"><span data-i18n="hud.score"></span> <b id="hud-score" class="c-gold">-</b></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="arena" role="img" aria-label="" aria-describedby="arena-desc"></canvas>
        <p id="canvas-msg" class="canvas-msg" hidden></p>
      </div>
      <ol id="ribbon" class="ribbon" aria-label=""></ol>
      <p id="ticker" class="ticker" aria-hidden="true"></p>
      <div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <p id="arena-desc" class="sr-only"></p>
      <div class="controls">
        <button id="btn-run" class="btn primary" type="button"></button>
        <button id="btn-step" class="btn" type="button" data-i18n="btn.step"></button>
        <button id="btn-finish" class="btn" type="button" data-i18n="btn.finish"></button>
        <label class="inline" for="speed"><span data-i18n="speed.label"></span>
          <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select>
        </label>
      </div>
      <p id="hud-pending" class="muted small-text" hidden data-i18n="hud.pending"></p>
      <div id="replay" class="replay" hidden>
        <h3 data-i18n="replay.title"></h3>
        <div class="replay-row">
          <button id="btn-replay-play" class="btn small" type="button"></button>
          <input id="replay-pos" type="range" min="0" max="5760" step="1" value="5760" aria-label="">
        </div>
        <canvas id="rail" class="rail" role="img" aria-label="" aria-describedby="replay-alt"></canvas>
        <p id="replay-text" class="small-text muted" aria-hidden="true"></p>
        <p id="replay-alt" class="small-text"></p>
        <p class="hint" data-i18n="replay.help"></p>
      </div>
    </section>

    <section id="panel-tabs" class="card tabs" aria-labelledby="tabs-title">
      <h2 id="tabs-title" class="sr-only" data-i18n="tabs.aria"></h2>
      <div id="tablist" class="tablist" role="tablist" aria-label="">
        <button id="tab-meters" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-meters" data-i18n="tab.meters"></button>
        <button id="tab-lab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-lab" tabindex="-1" data-i18n="tab.lab"></button>
        <button id="tab-ens" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-ens" tabindex="-1" data-i18n="tab.ens"></button>
        <button id="tab-ab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-ab" tabindex="-1" data-i18n="tab.ab"></button>
        <button id="tab-missions" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-missions" tabindex="-1" data-i18n="tab.missions"></button>
        <button id="tab-method" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-method" tabindex="-1" data-i18n="tab.method"></button>
      </div>

      <div id="panel-meters" class="tabpanel" role="tabpanel" aria-labelledby="tab-meters" tabindex="0">
<h2 id="meters-title" data-i18n="meters.title"></h2>
        <div class="meters-grid">
          <div>
            <div class="meter-row"><span class="m-name">A</span><div id="m-gain-0" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-0" class="m-fill"></span><span id="m-eff-0" class="m-eff"></span></div><span id="m-val-0" class="m-val"></span></div>
            <div class="meter-row"><span class="m-name">B</span><div id="m-gain-1" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-1" class="m-fill"></span><span id="m-eff-1" class="m-eff"></span></div><span id="m-val-1" class="m-val"></span></div>
            <div class="meter-row"><span class="m-name">C</span><div id="m-gain-2" class="meter" role="meter" aria-valuemin="0" aria-valuemax="3.2" aria-valuenow="1"><span class="m-band"></span><span id="m-fill-2" class="m-fill"></span><span id="m-eff-2" class="m-eff"></span></div><span id="m-val-2" class="m-val"></span></div>
            <div class="meter-row"><span class="m-name">R</span><div id="m-rate" class="meter" role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5"><span class="m-tick"></span><span id="m-rate-fill" class="m-fill rate"></span></div><span id="m-rate-val" class="m-val"></span></div>
            <p id="m-state" class="muted small-text"></p>
            <p class="hint" data-i18n="meters.help"></p>
          </div>
          <div>
            <h3 data-i18n="fit.title"></h3>
            <canvas id="fit" class="chart" role="img" aria-label=""></canvas>
            <p class="hint" data-i18n="fit.help"></p>
          </div>
        </div>
      </div>

      <div id="panel-lab" class="tabpanel" role="tabpanel" aria-labelledby="tab-lab" tabindex="0" hidden>
        <h2 id="lab-title" data-i18n="lab.title"></h2>
        <p class="small-text muted" data-i18n="lab.intro"></p>
        <p id="lab-empty" class="beat" data-i18n="lab.empty"></p>
        <div class="inst-grid">
        <figure class="inst">
          <h3 id="h-lab-rates" data-i18n="lab.rates.title"></h3>
          <canvas id="lab-rates" class="chart" role="img" aria-label="" aria-describedby="alt-rates"></canvas>
          <p id="alt-rates" class="alt"></p>
          <p class="hint" data-i18n="lab.rates.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-align" data-i18n="lab.align.title"></h3>
          <label class="inline small-text" for="lab-gen"><span data-i18n="lab.gen.label"></span> <select id="lab-gen"></select></label>
          <canvas id="lab-align" class="chart" role="img" aria-label="" aria-describedby="alt-align"></canvas>
          <p id="alt-align" class="alt"></p>
          <p class="hint" data-i18n="lab.align.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-hist" data-i18n="lab.hist.title"></h3>
          <canvas id="lab-hist" class="chart" role="img" aria-label="" aria-describedby="alt-hist"></canvas>
          <p id="alt-hist" class="alt"></p>
          <p class="hint" id="lab-hist-help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-sweep" data-i18n="lab.sweep.title"></h3>
          <canvas id="lab-sweep" class="chart" role="img" aria-label="" aria-describedby="alt-sweep"></canvas>
          <p id="alt-sweep" class="alt"></p>
          <p class="hint" data-i18n="lab.sweep.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-shield" data-i18n="lab.shield.title"></h3>
          <canvas id="lab-shield" class="chart" role="img" aria-label="" aria-describedby="alt-shield"></canvas>
          <p id="alt-shield" class="alt"></p>
          <p class="hint" data-i18n="lab.shield.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-gain" data-i18n="lab.gain.title"></h3>
          <canvas id="lab-gain" class="chart tall" role="img" aria-label="" aria-describedby="alt-gain"></canvas>
          <p id="alt-gain" class="alt"></p>
          <p class="hint" data-i18n="lab.gain.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-land" data-i18n="lab.land.title"></h3>
          <label class="inline small-text" for="lab-axes"><span data-i18n="lab.axes.label"></span> <select id="lab-axes"><option value="th-g"></option><option value="th-c"></option><option value="c-g"></option></select></label>
          <canvas id="lab-land" class="chart" role="img" aria-label="" aria-describedby="alt-land"></canvas>
          <p id="alt-land" class="alt"></p>
          <p class="hint" data-i18n="lab.land.help"></p>
        </figure>
        <figure class="inst">
          <h3 id="h-lab-amp" data-i18n="lab.amp.title"></h3>
          <canvas id="lab-amp" class="chart" role="img" aria-label="" aria-describedby="alt-amp"></canvas>
          <p id="alt-amp" class="alt"></p>
          <p class="hint" id="lab-amp-help"></p>
        </figure>
        </div>
        <figure class="inst wide">
          <h3 id="h-sci" data-i18n="sci.title"></h3>
          <p class="small-text"><span class="key key-prec"></span><span data-i18n="sci.prec"></span> <span class="key key-base"></span><span data-i18n="sci.base"></span></p>
          <canvas id="sci" class="chart tall" role="img" aria-label="" aria-describedby="sci-base"></canvas>
          <p class="small-text" data-i18n="sci.events"></p>
          <p id="sci-base" class="hint"></p>
          <p class="hint" data-i18n="sci.help"></p>
        </figure>
        <h3 data-i18n="lab.export.title"></h3>
        <div class="row">
          <button id="btn-exp-run-csv" class="btn small" type="button" data-i18n="lab.export.csv"></button>
          <button id="btn-exp-run-json" class="btn small" type="button" data-i18n="lab.export.json"></button>
        </div>
        <p id="exp-status" class="hint" role="status"></p>
        <textarea id="exp-text" class="exp" rows="6" readonly hidden aria-label="Export"></textarea>
      </div>

      <div id="panel-ens" class="tabpanel" role="tabpanel" aria-labelledby="tab-ens" tabindex="0" hidden>
        <h2 data-i18n="ens.title"></h2>
        <p class="small-text muted" data-i18n="ens.help"></p>
        <div class="formrow">
          <label class="inline" for="ens-n"><span data-i18n="ens.n.label"></span>
            <select id="ens-n"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="80">80</option></select></label>
          <label class="switch"><input id="ens-repo" type="checkbox" checked><span data-i18n="ens.repo.label"></span></label>
        </div>
        <div class="row">
          <button id="btn-ens-match" class="btn small" type="button" data-i18n="ens.match"></button>
          <button id="btn-ens-run" class="btn primary small" type="button" data-i18n="ens.run"></button>
          <button id="btn-ens-cancel" class="btn small" type="button" data-i18n="ens.cancel" disabled></button>
        </div>
        <p class="small-text"><progress id="ens-progress" max="1" value="0" aria-label=""></progress> <span id="ens-status" role="status"></span></p>
        <p id="ens-empty" class="hint" data-i18n="ens.empty"></p>
        <div id="ens-out" hidden>
          <canvas id="ens-chart" class="chart ens" role="img" aria-label="" aria-describedby="ens-alt"></canvas>
          <p id="ens-alt" class="alt"></p>
          <p id="ens-like" class="beat small-text"></p>
          <div class="tablewrap"><table id="ens-table" class="scores"></table></div>
          <p id="ens-note" class="hint"></p>
          <div class="row">
            <button id="btn-ens-csv" class="btn small" type="button" data-i18n="ens.csv"></button>
            <button id="btn-ens-json" class="btn small" type="button" data-i18n="ens.json"></button>
          </div>
        </div>
      </div>

      <div id="panel-ab" class="tabpanel" role="tabpanel" aria-labelledby="tab-ab" tabindex="0" hidden>
        <h2 data-i18n="ab.title"></h2>
        <p class="small-text muted" data-i18n="ab.help"></p>
        <div class="formrow">
          <label class="inline" for="ab-factor"><span data-i18n="ab.factor.label"></span>
            <select id="ab-factor"><option value="scheme"></option><option value="shield"></option><option value="amp"></option><option value="stab"></option><option value="evolve"></option><option value="w"></option></select></label>
          <label class="inline" for="ab-a"><span data-i18n="ab.a.label"></span> <select id="ab-a"></select></label>
          <label class="inline" for="ab-b"><span data-i18n="ab.b.label"></span> <select id="ab-b"></select></label>
          <label class="inline" for="ab-n"><span data-i18n="ab.n.label"></span>
            <select id="ab-n"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option><option value="80">80</option></select></label>
        </div>
        <label class="switch"><input id="ab-repo" type="checkbox" checked><span data-i18n="ab.repo.label"></span></label>
        <p class="hint" data-i18n="ab.others"></p>
        <div class="row">
          <button id="btn-ab-run" class="btn primary small" type="button" data-i18n="ab.run"></button>
          <button id="btn-ab-cancel" class="btn small" type="button" data-i18n="ab.cancel" disabled></button>
        </div>
        <p class="small-text"><progress id="ab-progress" max="1" value="0" aria-label=""></progress> <span id="ab-status" role="status"></span></p>
        <p id="ab-empty" class="hint" data-i18n="ab.empty"></p>
        <div id="ab-out" hidden>
          <canvas id="ab-chart" class="chart ens" role="img" aria-label="" aria-describedby="ab-alt"></canvas>
          <p class="hint" data-i18n="ab.legend"></p>
          <p id="ab-alt" class="alt"></p>
          <p id="ab-verdict" class="beat small-text"></p>
          <div class="tablewrap"><table id="ab-table" class="scores"></table></div>
          <div class="row">
            <button id="btn-ab-csv" class="btn small" type="button" data-i18n="ab.csv"></button>
            <button id="btn-ab-json" class="btn small" type="button" data-i18n="ab.json"></button>
          </div>
        </div>
      </div>

      <div id="panel-missions" class="tabpanel" role="tabpanel" aria-labelledby="tab-missions" tabindex="0" hidden>
        <h2 data-i18n="mis.title"></h2>
        <p class="small-text muted" data-i18n="mis.help"></p>
        <ol id="missions-list" class="missions"></ol>
        <p id="mis-note" class="hint" role="status"></p>
      </div>

      <div id="panel-method" class="tabpanel" role="tabpanel" aria-labelledby="tab-method" tabindex="0" hidden>
        <h2 data-i18n="method.title"></h2>
        <h3 data-i18n="method.measured"></h3>
        <ul class="method"><li data-i18n="method.m1"></li><li data-i18n="method.m2"></li><li data-i18n="method.m3"></li><li data-i18n="method.m4"></li></ul>
        <h3 data-i18n="method.design"></h3>
        <ul class="method"><li data-i18n="method.d1"></li><li data-i18n="method.d2"></li><li data-i18n="method.d3"></li></ul>
        <h3 data-i18n="method.unverified"></h3>
        <ul class="method"><li data-i18n="method.u1"></li><li data-i18n="method.u2"></li><li data-i18n="method.u3"></li><li data-i18n="method.u4"></li><li data-i18n="method.u5"></li></ul>
        <h3 data-i18n="method.visual"></h3>
        <ul class="method"><li data-i18n="method.v1"></li><li data-i18n="method.v2"></li><li data-i18n="method.v3"></li><li data-i18n="method.v4"></li><li data-i18n="method.v5"></li><li data-i18n="method.v6"></li></ul>
      </div>
    </section>

    </div>

    <section class="card setup" aria-labelledby="setup-title">
      <h2 id="setup-title" data-i18n="setup.title"></h2>
      <p class="muted small-text" data-i18n="setup.note"></p>

      <div class="field">
        <label for="scheme" data-i18n="scheme.label"></label>
        <select id="scheme"></select>
        <p id="scheme-desc" class="hint" data-i18n="scheme.desc"></p>
      </div>

      <div class="field">
        <label for="w" data-i18n="w.label"></label>
        <div class="sliderrow"><span class="end" data-i18n="w.comp"></span>
          <input id="w" type="range" min="0" max="1" step="0.25" value="0.5">
          <span class="end" data-i18n="w.coop"></span><output id="w-val" for="w">50%</output></div>
        <p class="hint" data-i18n="w.help"></p>
      </div>

      <div class="field switches">
        <label class="switch"><input id="t-shield" type="checkbox" checked><span data-i18n="shield.label"></span></label>
        <p class="hint" data-i18n="shield.help"></p>
        <label class="switch"><input id="t-amp" type="checkbox"><span data-i18n="amp.label"></span></label>
        <p class="hint" data-i18n="amp.help"></p>
        <label class="switch"><input id="t-stab" type="checkbox"><span data-i18n="stab.label"></span></label>
        <p class="hint" data-i18n="stab.help"></p>
        <label class="switch"><input id="t-evolve" type="checkbox" checked><span data-i18n="evolve.label"></span></label>
        <p class="hint" data-i18n="evolve.help"></p>
      </div>

      <details id="adv" class="field">
        <summary data-i18n="adv.title"></summary>
        <p class="hint" data-i18n="start.note"></p>
        <div class="sliderrow"><label for="th" data-i18n="th.label"></label><input id="th" type="range" min="0.1" max="1.2" step="0.01" value="0.5"><output id="th-val" for="th"></output></div>
        <div class="sliderrow"><label for="c" data-i18n="c.label"></label><input id="c" type="range" min="0" max="0.5" step="0.01" value="0.05"><output id="c-val" for="c"></output></div>
        <div class="sliderrow"><label for="g" data-i18n="g.label"></label><input id="g" type="range" min="0.5" max="2" step="0.01" value="1"><output id="g-val" for="g"></output></div>
        <p id="adv-locked" class="hint" hidden data-i18n="adv.locked"></p>
        <button id="btn-defaults" class="btn small" type="button" data-i18n="btn.defaults"></button>
        <div class="sliderrow"><label for="fcost" data-i18n="fcost.label"></label><input id="fcost" type="range" min="0" max="2" step="0.25" value="0"><output id="fcost-val" for="fcost"></output></div>
        <p class="hint" data-i18n="fcost.help"></p>
      </details>
      <p id="cfg-note" class="hint"></p>
    </section>
  </div>

  <section id="s-result" class="card result" aria-labelledby="result-title" tabindex="-1" hidden>
    <h2 id="result-title" tabindex="-1" data-i18n="result.title"></h2>
    <p id="result-score" class="big"></p>
    <div id="parts" class="parts"></div>
    <p class="hint" data-i18n="result.formula"></p>

    <h3 data-i18n="cmp.title"></h3>
    <div class="tablewrap"><table id="cmp" class="scores"></table></div>
    <p id="cmp-note" class="hint"></p>
    <p id="challenge-result" class="beat" hidden></p>
    <details class="field"><summary data-i18n="cmp.schemes"></summary>
      <div class="tablewrap"><table id="schemes-table" class="scores"></table></div>
      <p id="schemes-source" class="hint"></p>
    </details>

    <div class="lesson" id="lesson-box">
      <h3 data-i18n="lesson.title"></h3>
      <h4 id="lesson-title"></h4>
      <p id="lesson-body"></p>
      <button id="btn-lesson-more" class="btn small" type="button" data-i18n="lesson.more"></button>
    </div>

    <h3 data-i18n="params.title"></h3>
    <ul id="params" class="stats"></ul>

    <h3 data-i18n="share.title_label"></h3>
    <pre id="share-text" tabindex="0"></pre>
    <div class="row">

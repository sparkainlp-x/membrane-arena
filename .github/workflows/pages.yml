name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/*.test.js
      - name: Build the single file
        run: |
          node build.js
          mkdir _site
          cp dist/index.html _site/index.html
          cp dist/brain.html _site/brain.html
          cp dist/quorum.html _site/quorum.html
          cp dist/reverse.html _site/reverse.html
          cp dist/pair.html _site/pair.html
          cp dist/watch.html _site/watch.html
          cp dist/pulse.html _site/pulse.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Tests (node built-in runner)
        run: node --test tests/*.test.js
      - name: baselines.js matches the CSV copies
        run: node scripts/make-baselines.js --check
      - name: Reverse Pair evaluation reproduces (every number, SHA-256 checked)
        run: node scripts/pair-check.js --verify > /dev/null
      - name: dist/index.html, dist/brain.html, dist/quorum.html, dist/reverse.html, dist/pair.html and dist/watch.html are up to date
        run: |
          node build.js
          git diff --exit-code dist/index.html dist/brain.html dist/quorum.html dist/reverse.html dist/pair.html dist/watch.html

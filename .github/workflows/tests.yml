name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Tests (node built-in runner)
        run: node --test tests/
      - name: baselines.js matches the CSV copies
        run: node scripts/make-baselines.js --check
      - name: dist/index.html is up to date
        run: |
          node build.js
          git diff --exit-code dist/index.html
